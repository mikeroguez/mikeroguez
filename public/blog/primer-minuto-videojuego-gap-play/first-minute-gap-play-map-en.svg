<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 560">
  <title id="title">GAP and PLAY in a video game's first minute</title>
  <desc id="desc">Diagram showing the first minute as a translation between the designer's map and the player's mental model.</desc>
  <defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path d="M0,0 L10,4 L0,8 Z" fill="#7a4a1c"/></marker></defs>
  <rect width="960" height="560" fill="#eee8dc"/><rect x="24" y="24" width="912" height="512" rx="10" fill="#f8f6f0" stroke="#d8d0c1" stroke-width="1.5"/>
  <text x="480" y="61" text-anchor="middle" fill="#20294d" font-size="24" font-weight="750">The first minute translates design into experience</text>
  <text x="480" y="88" text-anchor="middle" fill="#5d6870" font-size="13">Expected experience emerges as the player understands, tries, and receives clear feedback.</text>
  <line x1="72" y1="133" x2="888" y2="133" stroke="#d8d0c1"/>
  <text x="154" y="168" text-anchor="middle" fill="#20294d" font-size="16" font-weight="750">Designer’s map</text><rect x="68" y="190" width="172" height="166" rx="8" fill="#fff" stroke="#d8d0c1"/>
  <text x="96" y="224" fill="#20294d" font-size="13" font-weight="700">Intends to create</text><text x="96" y="251" fill="#5d6870" font-size="12">rules</text><text x="96" y="279" fill="#5d6870" font-size="12">actions</text><text x="96" y="307" fill="#5d6870" font-size="12">rhythm</text><text x="96" y="335" fill="#5d6870" font-size="12">challenge</text>
  <text x="806" y="168" text-anchor="middle" fill="#20294d" font-size="16" font-weight="750">Player’s model</text><rect x="720" y="190" width="172" height="166" rx="8" fill="#fff" stroke="#d8d0c1"/>
  <text x="748" y="224" fill="#20294d" font-size="13" font-weight="700">Tries to understand</text><text x="748" y="251" fill="#5d6870" font-size="12">what to notice</text><text x="748" y="279" fill="#5d6870" font-size="12">what to do</text><text x="748" y="307" fill="#5d6870" font-size="12">what changed</text><text x="748" y="335" fill="#5d6870" font-size="12">why continue</text>
  <line x1="250" y1="273" x2="296" y2="273" stroke="#7a4a1c" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="664" y1="273" x2="710" y2="273" stroke="#7a4a1c" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="296" y="151" width="368" height="238" rx="10" fill="#eee8dc" stroke="#d8d0c1" stroke-width="1.4"/><text x="480" y="183" text-anchor="middle" fill="#20294d" font-size="18" font-weight="750">First minute</text><text x="480" y="206" text-anchor="middle" fill="#5d6870" font-size="12">entry, practice, and feedback</text>
  <g fill="#fff" stroke="#d8d0c1"><rect x="322" y="236" width="148" height="52" rx="7"/><rect x="490" y="236" width="148" height="52" rx="7"/><rect x="322" y="313" width="148" height="52" rx="7"/><rect x="490" y="313" width="148" height="52" rx="7"/></g>
  <g text-anchor="middle"><text x="396" y="258" fill="#20294d" font-size="14" font-weight="700">Orient</text><text x="396" y="278" fill="#5d6870" font-size="11">I know what to notice</text><text x="564" y="258" fill="#20294d" font-size="14" font-weight="700">Act</text><text x="564" y="278" fill="#5d6870" font-size="11">I can try</text><text x="396" y="335" fill="#20294d" font-size="14" font-weight="700">Receive</text><text x="396" y="355" fill="#5d6870" font-size="11">I understand the effect</text><text x="564" y="335" fill="#20294d" font-size="14" font-weight="700">Practise</text><text x="564" y="355" fill="#5d6870" font-size="11">I gain confidence</text></g>
  <rect x="84" y="414" width="360" height="88" rx="8" fill="#fff" stroke="#d8d0c1"/><text x="112" y="444" fill="#7a4a1c" font-size="20" font-weight="800">GAP</text><text x="172" y="443" fill="#20294d" font-size="14" font-weight="700">Is the entrance approachable?</text><text x="112" y="470" fill="#5d6870" font-size="12">Shows, enables practice, and gives timely information.</text>
  <rect x="516" y="414" width="360" height="88" rx="8" fill="#fff" stroke="#d8d0c1"/><text x="544" y="444" fill="#7a4a1c" font-size="20" font-weight="800">PLAY</text><text x="615" y="443" fill="#20294d" font-size="14" font-weight="700">Can play be sustained?</text><text x="544" y="470" fill="#5d6870" font-size="12">Makes fun, challenge, and control reviewable.</text>
  <text x="480" y="524" text-anchor="middle" fill="#5d6870" font-size="12" font-style="italic">The question is not whether a game explains more, but whether it enables a better entrance.</text>
</svg>
