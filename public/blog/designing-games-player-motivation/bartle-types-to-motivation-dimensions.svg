<svg
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="bartle-dim-en-title bartle-dim-en-desc"
  viewBox="0 0 900 520"
>
  <title id="bartle-dim-en-title">From Bartle's four player types to motivation dimensions</title>
  <desc id="bartle-dim-en-desc">
    Conceptual diagram comparing two models of player motivation. On the left, Bartle's
    1996 model is shown as a 2-by-2 quadrant grid with two crossing axes: a horizontal
    axis from Players on the left to World on the right, and a vertical axis from Acting
    at the top to Interacting at the bottom. The four resulting quadrants contain the
    player types: Killers in the top-left (acting on other players to dominate them),
    Achievers in the top-right (acting on the world to master it), Socialisers in the
    bottom-left (interacting with other players to relate to them), and Explorers in the
    bottom-right (interacting with the world to discover it). A central arrow marks the
    conceptual shift. On the right, the McKechnie-Martin et al. 2024 framework shows one
    hypothetical player simultaneously holding six motivational dimensions at varying
    intensities: Autonomy at high, Competence at high, Exploration at medium, Fellowship
    at low, Relaxation at medium, and Creativity at high. The contrast illustrates the
    shift from four fixed mutually exclusive categories to a spectrum of dimensions
    that one player can hold simultaneously at different intensities.
  </desc>

  <defs>
    <style>
      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#eee8dc" />
  <!-- Card -->
  <rect x="18" y="18" width="864" height="484" rx="14" fill="#f8f6f0" stroke="#d8d0c1" stroke-width="1.5" />

  <!-- ══════════════════ LEFT COLUMN — Bartle (1996) ════════════════════ -->

  <text x="219" y="52" text-anchor="middle" fill="#20294d" font-size="17" font-weight="700">Bartle (1996)</text>
  <text x="219" y="70" text-anchor="middle" fill="#5d6870" font-size="12">4 fixed types — mutually exclusive</text>
  <line x1="36" y1="80" x2="402" y2="80" stroke="#d8d0c1" stroke-width="1" />

  <!-- Quadrant frame -->
  <rect x="50" y="98" width="338" height="320" rx="6" fill="none" stroke="#d8d0c1" stroke-width="1" />

  <!-- Axes (cross) -->
  <line x1="50" y1="258" x2="388" y2="258" stroke="#b8b0a1" stroke-width="1.5" />
  <line x1="219" y1="98" x2="219" y2="418" stroke="#b8b0a1" stroke-width="1.5" />
  <!-- Center dot at intersection -->
  <circle cx="219" cy="258" r="3" fill="#b8b0a1" />

  <!-- Axis end labels -->
  <text x="58" y="254" text-anchor="start" fill="#5d6870" font-size="10">Players</text>
  <text x="380" y="254" text-anchor="end" fill="#5d6870" font-size="10">World</text>
  <text x="219" y="95" text-anchor="middle" fill="#5d6870" font-size="10">Acting</text>
  <text x="219" y="432" text-anchor="middle" fill="#5d6870" font-size="10">Interacting</text>

  <!-- Killers — top-left (acting on players) -->
  <text x="134" y="178" text-anchor="middle" font-size="14" font-weight="700">
    <tspan fill="#7a4a1c">♣</tspan><tspan fill="#20294d"> Killers</tspan>
  </text>
  <text x="134" y="197" text-anchor="middle" fill="#5d6870" font-size="11">dominate others</text>

  <!-- Achievers — top-right (acting on the world) -->
  <text x="304" y="178" text-anchor="middle" font-size="14" font-weight="700">
    <tspan fill="#7a4a1c">◆</tspan><tspan fill="#20294d"> Achievers</tspan>
  </text>
  <text x="304" y="197" text-anchor="middle" fill="#5d6870" font-size="11">master the world</text>

  <!-- Socialisers — bottom-left (interacting with players) -->
  <text x="134" y="332" text-anchor="middle" font-size="14" font-weight="700">
    <tspan fill="#7a4a1c">♥</tspan><tspan fill="#20294d"> Socialisers</tspan>
  </text>
  <text x="134" y="351" text-anchor="middle" fill="#5d6870" font-size="11">relate to others</text>

  <!-- Explorers — bottom-right (interacting with the world) -->
  <text x="304" y="332" text-anchor="middle" font-size="14" font-weight="700">
    <tspan fill="#7a4a1c">♠</tspan><tspan fill="#20294d"> Explorers</tspan>
  </text>
  <text x="304" y="351" text-anchor="middle" fill="#5d6870" font-size="11">discover the world</text>

  <!-- Left caption -->
  <text x="219" y="462" text-anchor="middle" fill="#5d6870" font-size="11" font-style="italic">One player belongs to one quadrant only.</text>

  <!-- ══════════════════ CENTER ARROW ═══════════════════════════════════ -->

  <text x="450" y="238" text-anchor="middle" fill="#5d6870" font-size="10">from types</text>
  <line x1="414" y1="250" x2="479" y2="250" stroke="#7a4a1c" stroke-width="2" />
  <polygon points="479,244 492,250 479,256" fill="#7a4a1c" />
  <text x="450" y="268" text-anchor="middle" fill="#5d6870" font-size="10">to dimensions</text>

  <!-- ══════════════════ RIGHT COLUMN — McKechnie-Martin et al. ═════════ -->

  <text x="690" y="52" text-anchor="middle" fill="#20294d" font-size="17" font-weight="700">McKechnie-Martin et al. (2024)</text>
  <text x="690" y="70" text-anchor="middle" fill="#5d6870" font-size="12">Dimensions with variable intensity</text>
  <line x1="498" y1="80" x2="882" y2="80" stroke="#d8d0c1" stroke-width="1" />

  <!-- Player indicator -->
  <circle cx="690" cy="97" r="9" fill="#20294d" />
  <text x="690" y="116" text-anchor="middle" fill="#5d6870" font-size="11" font-style="italic">one player</text>
  <line x1="690" y1="120" x2="690" y2="133" stroke="#d8d0c1" stroke-width="1" stroke-dasharray="3 2" />

  <!-- Bars: label right-aligned at x=622, track x=630 width=230, level at x=874 text-anchor=end -->

  <!-- Autonomy — high (85%) -->
  <text x="622" y="148" text-anchor="end" fill="#20294d" font-size="13" font-weight="600">Autonomy</text>
  <rect x="630" y="135" width="230" height="14" rx="4" fill="#e8e1d5" />
  <rect x="630" y="135" width="196" height="14" rx="4" fill="#20294d" />
  <text x="874" y="148" text-anchor="end" fill="#5d6870" font-size="10">high</text>

  <!-- Competence — high (75%) -->
  <text x="622" y="191" text-anchor="end" fill="#20294d" font-size="13" font-weight="600">Competence</text>
  <rect x="630" y="178" width="230" height="14" rx="4" fill="#e8e1d5" />
  <rect x="630" y="178" width="173" height="14" rx="4" fill="#20294d" />
  <text x="874" y="191" text-anchor="end" fill="#5d6870" font-size="10">high</text>

  <!-- Exploration — medium (50%) -->
  <text x="622" y="234" text-anchor="end" fill="#20294d" font-size="13" font-weight="600">Exploration</text>
  <rect x="630" y="221" width="230" height="14" rx="4" fill="#e8e1d5" />
  <rect x="630" y="221" width="115" height="14" rx="4" fill="#39476f" />
  <text x="874" y="234" text-anchor="end" fill="#5d6870" font-size="10">medium</text>

  <!-- Fellowship — low (18%) -->
  <text x="622" y="277" text-anchor="end" fill="#20294d" font-size="13" font-weight="600">Fellowship</text>
  <rect x="630" y="264" width="230" height="14" rx="4" fill="#e8e1d5" />
  <rect x="630" y="264" width="41" height="14" rx="4" fill="#7a4a1c" />
  <text x="874" y="277" text-anchor="end" fill="#5d6870" font-size="10">low</text>

  <!-- Relaxation — medium (38%) -->
  <text x="622" y="320" text-anchor="end" fill="#20294d" font-size="13" font-weight="600">Relaxation</text>
  <rect x="630" y="307" width="230" height="14" rx="4" fill="#e8e1d5" />
  <rect x="630" y="307" width="87" height="14" rx="4" fill="#39476f" />
  <text x="874" y="320" text-anchor="end" fill="#5d6870" font-size="10">medium</text>

  <!-- Creativity — high (65%) -->
  <text x="622" y="363" text-anchor="end" fill="#20294d" font-size="13" font-weight="600">Creativity</text>
  <rect x="630" y="350" width="230" height="14" rx="4" fill="#e8e1d5" />
  <rect x="630" y="350" width="150" height="14" rx="4" fill="#20294d" />
  <text x="874" y="363" text-anchor="end" fill="#5d6870" font-size="10">high</text>

  <!-- Right caption -->
  <text x="690" y="426" text-anchor="middle" fill="#5d6870" font-size="11" font-style="italic">One player, multiple dimensions at once.</text>

</svg>
